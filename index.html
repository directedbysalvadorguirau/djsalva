<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="origin">
  <title>DJ SALVA Sessions</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" type="image/png" href="/favicon.png">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- HLS -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root{
      --ui-pad: 14px;
      --panel-w: min(420px, 86vw);
    }

    html, body{
      height:100%;
      margin:0;
      background:#000;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      overflow:hidden;
      overscroll-behavior:none;
      touch-action:pan-x pan-y;
      -webkit-touch-callout:none;
      -webkit-text-size-adjust:100%;
    }

    body{
      -ms-overflow-style:none;
      scrollbar-width:none;
    }

    body::-webkit-scrollbar{ display:none; }

    img,
    svg{
      user-select:none;
      -webkit-user-select:none;
      -webkit-user-drag:none;
      -webkit-touch-callout:none;
    }

    [hidden]{ display:none !important; }

    .portal-shell{
      height:100vh;
      height:100svh;
      width:100%;
      display:grid;
      place-items:center;
      background:#fff;
      color:#111;
      position:relative;
      overflow:hidden;
    }

    .portal-view{
      width:min(920px, 100%);
      min-height:100vh;
      min-height:100svh;
      box-sizing:border-box;
      padding:max(18px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(18px, 3vh, 34px);
      background:
        radial-gradient(circle at 50% 18%, rgba(208,208,208,0.2), transparent 35%),
        #fff;
    }

    .portal-brand{
      width:min(100vw, 780px);
      height:min(48svh, 520px);
      object-fit:cover;
      object-position:center 49%;
      user-select:none;
      -webkit-user-drag:none;
      animation:portalBrandIn .6s cubic-bezier(.2,.75,.25,1) both;
    }

    .portal-grid{
      width:min(650px, 100%);
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:clamp(28px, 6vh, 62px) clamp(34px, 9vw, 100px);
    }

    .portal-link,
    .session-link{
      color:#151515;
      text-decoration:none;
      border:0;
      background:transparent;
      padding:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:13px;
      font:inherit;
      font-weight:700;
      font-size:16px;
      line-height:1.15;
      text-align:center;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      animation:portalIconIn .5s cubic-bezier(.2,.75,.25,1) both;
    }

    .portal-link:nth-child(2),
    .session-link:nth-child(2){ animation-delay:.06s; }
    .portal-link:nth-child(3),
    .session-link:nth-child(3){ animation-delay:.12s; }
    .portal-link:nth-child(4){ animation-delay:.18s; }

    .portal-link:active .portal-icon,
    .session-link:active .session-cover{
      --motion-scale:.94;
      transition-duration:80ms;
    }

    .portal-link:focus-visible,
    .session-link:focus-visible,
    .portal-back:focus-visible{
      outline:3px solid #1687ff;
      outline-offset:7px;
      border-radius:18px;
    }

    .portal-icon{
      --motion-x:0px;
      --motion-y:0px;
      --motion-rotate:0deg;
      --motion-scale:1;
      width:clamp(88px, 12vw, 126px);
      height:clamp(88px, 12vw, 126px);
      display:grid;
      place-items:center;
      transform:translate3d(var(--motion-x), var(--motion-y), 0) rotate(var(--motion-rotate)) scale(var(--motion-scale));
      transition:transform .24s cubic-bezier(.2,.8,.2,1), filter .24s ease;
      filter:drop-shadow(0 9px 16px rgba(0,0,0,.12));
      will-change:transform;
    }

    .portal-icon svg{
      width:100%;
      height:100%;
      display:block;
      overflow:visible;
    }

    .portal-icon img{
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
    }

    .portal-title{
      margin:0;
      font-size:clamp(22px, 4vw, 34px);
      font-weight:850;
      letter-spacing:-.04em;
    }

    .portal-back{
      position:absolute;
      top:max(22px, env(safe-area-inset-top));
      left:max(22px, env(safe-area-inset-left));
      width:48px;
      height:48px;
      border:0;
      border-radius:15px;
      display:grid;
      place-items:center;
      background:#f2f2f4;
      color:#111;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .portal-back svg{ width:25px; height:25px; }

    .session-back{
      position:absolute;
      left:var(--ui-pad);
      bottom:max(var(--ui-pad), env(safe-area-inset-bottom));
      z-index:58;
      height:42px;
      padding:0 14px 0 11px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:14px;
      display:flex;
      align-items:center;
      gap:6px;
      background:rgba(0,0,0,.28);
      color:#fff;
      font:700 13px/1 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      cursor:pointer;
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
      -webkit-tap-highlight-color:transparent;
    }

    .session-back svg{
      width:18px;
      height:18px;
      flex:0 0 auto;
    }

    .session-back:active{ transform:scale(.96); }

    .session-back:focus-visible{
      outline:3px solid #fff;
      outline-offset:3px;
    }

    .sessions-grid{
      width:min(690px, 100%);
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:clamp(22px, 5vw, 54px);
      align-items:start;
    }

    .session-cover{
      --motion-x:0px;
      --motion-y:0px;
      --motion-rotate:0deg;
      --motion-scale:1;
      width:clamp(82px, 16vw, 150px);
      aspect-ratio:1;
      border-radius:25%;
      object-fit:cover;
      box-shadow:0 12px 28px rgba(0,0,0,.16);
      transform:translate3d(var(--motion-x), var(--motion-y), 0) rotate(var(--motion-rotate)) scale(var(--motion-scale));
      transition:transform .24s cubic-bezier(.2,.8,.2,1), box-shadow .24s ease;
      will-change:transform;
    }

    @media (hover:hover) and (pointer:fine){
      .portal-link:hover .portal-icon,
      .portal-link:focus-visible .portal-icon,
      .session-link:hover .session-cover,
      .session-link:focus-visible .session-cover{
        --motion-scale:1.045;
      }

      .portal-link:hover .portal-icon{
        filter:drop-shadow(0 15px 22px rgba(0,0,0,.17));
      }

      .session-link:hover .session-cover{
        box-shadow:0 18px 34px rgba(0,0,0,.21);
      }
    }

    @keyframes portalBrandIn{
      from{ opacity:0; transform:translateY(-12px) scale(.98); }
      to{ opacity:1; transform:translateY(0) scale(1); }
    }

    @keyframes portalIconIn{
      from{ opacity:0; transform:translateY(14px); }
      to{ opacity:1; transform:translateY(0); }
    }

    .stage{
      height:100vh;
      height:100svh;
      width:100vw;
      display:grid;
      place-items:center;
      background:#000;
      position:relative;
      overflow:hidden;
    }

    .frame{
      --screen-left: 0%;
      --screen-top: 20%;
      --screen-width: 72%;
      --screen-height: 26.9%;
      --btn-bottom: 18.5%;
      --video-scale: 1.2;

      position:relative;
      height:100vh;
      height:100svh;
      width:calc(100svh * 9 / 16);
      max-width:100vw;
      max-height:100svh;
      aspect-ratio:9/16;
      overflow:hidden;
    }

    .frame-salva03{
      --screen-left: 21.22%;
      --screen-top: 39.86%;
      --screen-width: 41.08%;
      --screen-height: 14.92%;
      --btn-bottom: 18.5%;
      --video-scale: 1.08;
    }

    .frame-ibicenca{
      --screen-left: 31%;
      --screen-top: 49%;
      --screen-width: 38.2%;
      --screen-height: 12.3%;
      --btn-bottom: 18.5%;
      --video-scale: 1.03;
    }

    .frame-classic{
      --screen-left: 0%;
      --screen-top: 20%;
      --screen-width: 72%;
      --screen-height: 26.9%;
      --btn-bottom: 18.5%;
      --video-scale: 1.2;
    }

    .bg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      pointer-events:none;
      user-select:none;
    }

    .screen{
      position:absolute;
      left:var(--screen-left);
      top:var(--screen-top);
      width:var(--screen-width);
      height:var(--screen-height);
      border-radius:0;
      overflow:hidden;
      background:#fff;
    }

    .frame-salva03 .screen{
      background:#000;
    }

    .screen video{
      width:100%;
      height:100%;
      display:block;
      background:#000;
      object-fit:cover;
      object-position:center;
      transform:scale(var(--video-scale));
      transform-origin:center;
      border-radius:0;
      will-change:transform;
      backface-visibility:hidden;
    }

    .frame-salva03 .screen video{
      position:absolute;
      inset:0;
      min-width:100%;
      min-height:100%;
      background:#000;
    }

    .top-actions{
      position:absolute;
      top:var(--ui-pad);
      right:var(--ui-pad);
      display:flex;
      align-items:center;
      gap:10px;
      z-index:50;
    }

    .top-btn,
    .menu-btn{
      width:48px;
      height:48px;
      border:none;
      background:rgba(0,0,0,0.25);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      border-radius:14px;
      display:grid;
      place-items:center;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .top-btn:active,
    .menu-btn:active{ transform:scale(0.96); }

    .mini-icon{
      width:24px;
      height:24px;
      fill:#fff;
      filter:drop-shadow(0 8px 18px rgba(0,0,0,0.55));
    }

    .bars{
      width:22px;
      height:18px;
      display:grid;
      align-content:center;
      gap:6px;
    }

    .bars span{
      display:block;
      height:3px;
      background:#fff;
      border-radius:999px;
      filter:drop-shadow(0 8px 18px rgba(0,0,0,0.55));
    }

    .audio-time{
      position:absolute;
      top:var(--ui-pad);
      left:var(--ui-pad);
      color:#fff;
      font-size:48px;
      font-weight:900;
      line-height:1;
      text-shadow:0 8px 18px rgba(0,0,0,0.55);
      user-select:none;
      pointer-events:none;
      z-index:55;
    }

    .play-btn{
      position:absolute;
      left:50%;
      bottom:var(--btn-bottom);
      transform:translateX(-50%);
      width:140px;
      height:140px;
      border:none;
      background:transparent;
      display:grid;
      place-items:center;
      cursor:pointer;
      z-index:20;
      -webkit-tap-highlight-color:transparent;
    }

    .play-btn:active{ transform:translateX(-50%) scale(0.95); }

    .icon{
      width:120px;
      height:120px;
      fill:#fff;
      filter:drop-shadow(0 12px 30px rgba(0,0,0,0.6));
    }

    .overlay{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.55);
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease;
      z-index:60;
    }

    .drawer{
      position:absolute;
      top:0;
      right:0;
      height:100%;
      width:var(--panel-w);
      background:rgba(10,10,10,0.92);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      transform:translateX(102%);
      transition:transform .22s ease;
      z-index:61;
      display:flex;
      flex-direction:column;
      border-left:1px solid rgba(255,255,255,0.08);
    }

    .drawer header{
      padding:18px 18px 12px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .drawer-title{
      color:#fff;
      font-weight:800;
      letter-spacing:0.2px;
      font-size:18px;
    }

    .close-btn{
      width:40px;
      height:40px;
      border:none;
      background:rgba(255,255,255,0.08);
      border-radius:12px;
      display:grid;
      place-items:center;
      cursor:pointer;
    }

    .close-btn svg{
      width:18px;
      height:18px;
      fill:#fff;
    }

    .tracks{
      padding:6px 10px 16px 10px;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
    }

    .track{
      width:100%;
      display:flex;
      gap:12px;
      align-items:center;
      padding:10px 10px;
      border-radius:14px;
      border:none;
      background:transparent;
      cursor:pointer;
      text-align:left;
    }

    .track:hover{ background:rgba(255,255,255,0.06); }

    .cover{
      width:46px;
      height:46px;
      border-radius:12px;
      background:#111;
      flex:0 0 auto;
      overflow:hidden;
    }

    .cover img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .meta{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
      flex:1 1 auto;
    }

    .name{
      color:#fff;
      font-weight:700;
      font-size:15px;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .time{
      color:rgba(255,255,255,0.7);
      font-size:13px;
      font-weight:600;
    }

    .open .overlay{
      opacity:1;
      pointer-events:auto;
    }

    .open .drawer{
      transform:translateX(0);
    }

    .sr{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    @media (max-width:600px){
      .portal-view{
        padding-left:22px;
        padding-right:22px;
        gap:clamp(22px, 4.5svh, 38px);
      }

      .portal-brand{
        width:min(100vw, 520px);
        height:min(40svh, 360px);
      }

      .portal-grid{
        width:min(360px, 100%);
        gap:clamp(28px, 5svh, 44px) 34px;
      }

      .portal-link,
      .session-link{
        font-size:14px;
      }

      .portal-icon{
        width:92px;
        height:92px;
      }

      .sessions-grid{
        gap:14px;
      }

      .session-cover{
        width:min(25vw, 108px);
        border-radius:24%;
      }

      .play-btn{
        width:110px;
        height:110px;
      }

      .icon{
        width:95px;
        height:95px;
      }

      .audio-time{
        font-size:36px;
      }

      .top-btn,
      .menu-btn{
        width:44px;
        height:44px;
      }

      .frame-salva03{
        --screen-left: 21.14%;
        --screen-top: 39.82%;
        --screen-width: 41.26%;
        --screen-height: 15.02%;
        --video-scale: 1.09;
      }

      .frame-ibicenca{
        --screen-left: 30.6%;
        --screen-top: 49%;
        --screen-width: 39%;
        --screen-height: 12.2%;
        --video-scale: 1.04;
      }
    }

    @supports (-webkit-touch-callout:none){
      @media (max-width:600px){
        .frame-salva03{
          --screen-left: 20.98%;
          --screen-top: 39.76%;
          --screen-width: 41.52%;
          --screen-height: 15.28%;
          --video-scale: 1.11;
        }
      }
    }

    @media (display-mode:standalone) and (max-width:600px){
      .frame-salva03{
        --screen-left: 21.16%;
        --screen-top: 39.88%;
        --screen-width: 40.96%;
        --screen-height: 14.96%;
        --video-scale: 1.11;
      }
    }
  </style>
</head>

<body>
  <section class="portal-shell" id="inicio" aria-label="Inicio DJ SALVA">
    <div class="portal-view" id="portalHome">
      <img class="portal-brand" src="pegatina-djsalva.png" alt="DJ SALVA">

      <nav class="portal-grid" aria-label="Enlaces DJ SALVA">
        <a class="portal-link" href="https://www.instagram.com/directedbysalva?utm_source=ig_web_button_share_sheet&amp;stkn=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener noreferrer">
          <span class="portal-icon" aria-hidden="true">
            <img src="instagram-icon.svg" alt="">
          </span>
          <span>Instagram</span>
        </a>

        <a class="portal-link" href="mailto:djsalva.booking@gmail.com">
          <span class="portal-icon" aria-hidden="true">
            <img src="gmail-icon.webp" alt="">
          </span>
          <span>Booking</span>
        </a>

        <a class="portal-link" id="calendarLink" href="/calendario-eventos.pdf">
          <span class="portal-icon" aria-hidden="true">
            <svg viewBox="0 0 128 128" role="img">
              <rect x="8" y="13" width="112" height="107" rx="24" fill="#fff" stroke="#e5e5e7"/>
              <path d="M8 39c0-14.36 11.64-26 26-26h60c14.36 0 26 11.64 26 26v13H8V39z" fill="#ff3b30"/>
              <path d="M37 8v18M91 8v18" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
              <text x="64" y="93" text-anchor="middle" font-size="47" font-weight="800" font-family="system-ui, sans-serif" fill="#171719">DJ</text>
            </svg>
          </span>
          <span>Calendario</span>
        </a>

        <button class="portal-link" id="openSessions" type="button" aria-controls="portalSessions">
          <span class="portal-icon" aria-hidden="true">
            <svg viewBox="0 0 128 128" role="img">
              <defs>
                <linearGradient id="folderTab" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#45c9ff"/>
                  <stop offset="1" stop-color="#1198e2"/>
                </linearGradient>
                <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#69d5ff"/>
                  <stop offset="1" stop-color="#29a9ed"/>
                </linearGradient>
              </defs>
              <path d="M9 34c0-9 7-16 16-16h28l12 12h38c9 0 16 7 16 16v55c0 9-7 16-16 16H25c-9 0-16-7-16-16V34z" fill="url(#folderTab)"/>
              <path d="M9 47h110v54c0 9-7 16-16 16H25c-9 0-16-7-16-16V47z" fill="url(#folderFront)"/>
              <path d="M13 51h102" stroke="#8ae2ff" stroke-width="3" opacity=".75"/>
            </svg>
          </span>
          <span>Sesiones</span>
        </button>
      </nav>
    </div>

    <div class="portal-view" id="portalSessions" hidden>
      <button class="portal-back" id="backHome" type="button" aria-label="Volver al inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <img class="portal-brand" src="pegatina-djsalva.png" alt="DJ SALVA">
      <h1 class="portal-title">Sesiones</h1>

      <nav class="sessions-grid" aria-label="Sesiones DJ SALVA">
        <a class="session-link" href="#classic">
          <img class="session-cover" src="djsalva-icon.png" alt="Portada DJ SALVA #01">
          <span>DJ SALVA #01</span>
        </a>
        <a class="session-link" href="#ibicenca">
          <img class="session-cover" src="icon-ibicenca.png" alt="Portada DJ SALVA #02">
          <span>DJ SALVA #02</span>
        </a>
        <a class="session-link" href="#salva03">
          <img class="session-cover" src="icon3.png" alt="Portada DJ SALVA #03">
          <span>DJ SALVA #03</span>
        </a>
      </nav>
    </div>
  </section>

  <section class="stage" id="salva03" hidden>
    <div class="frame frame-salva03" id="appSalva03">
      <img class="bg" src="fondo3.png" alt="DJ SALVA #03">

      <div class="screen">
        <video id="vidSalva03" playsinline webkit-playsinline muted preload="auto" loop></video>
      </div>

      <audio id="audSalva03Part1" preload="auto"></audio>
      <audio id="audSalva03Part2" preload="auto"></audio>

      <div class="top-actions">
        <button class="top-btn" id="shareBtnSalva03" aria-label="Compartir" title="Compartir">
          <svg class="mini-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a2.5 2.5 0 0 0 0-1.39l7-4.11A2.99 2.99 0 1 0 14 5a3 3 0 0 0 .05.5l-7 4.11a3 3 0 1 0 0 4.78l7.05 4.14c-.03.16-.05.31-.05.47a3 3 0 1 0 3-2.92z"></path>
          </svg>
        </button>

        <button class="menu-btn" id="openLibrarySalva03" aria-label="Abrir biblioteca">
          <span class="sr">Abrir biblioteca</span>
          <div class="bars" aria-hidden="true">

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(console.log);
      });
    }

    const VIDEO_RATE = 1.25;
    const SHARE_BASE_URL = `${location.origin}${location.pathname}`;
    const sessions = [];

    const portalHome = document.getElementById("portalHome");
    const portalSessions = document.getElementById("portalSessions");
    const portalShell = document.getElementById("inicio");
    const openSessions = document.getElementById("openSessions");
    const backHome = document.getElementById("backHome");
    const calendarLink = document.getElementById("calendarLink");

    const preventDefault = event => event.preventDefault();

    document.addEventListener("contextmenu", preventDefault);
    document.addEventListener("gesturestart", preventDefault, { passive:false });
    document.addEventListener("gesturechange", preventDefault, { passive:false });
    document.addEventListener("gestureend", preventDefault, { passive:false });
    document.addEventListener("touchmove", event => {
      if (event.touches.length > 1) event.preventDefault();
    }, { passive:false });
    document.addEventListener("dblclick", preventDefault);
    document.addEventListener("dragstart", event => {
      if (event.target instanceof Element && event.target.closest("img, svg")) {
        event.preventDefault();
      }
    });
    document.addEventListener("keydown", event => {
      if ((event.ctrlKey || event.metaKey) && ["+", "-", "=", "0"].includes(event.key)) {
        event.preventDefault();
      }
    });
    window.addEventListener("wheel", event => {
      if (event.ctrlKey) event.preventDefault();
    }, { passive:false });

    document.querySelectorAll(".portal-link, .session-link").forEach(link => {
      const visual = link.querySelector(".portal-icon, .session-cover");
      if (!visual) return;

      const resetMotion = () => {
        visual.style.setProperty("--motion-x", "0px");
        visual.style.setProperty("--motion-y", "0px");
        visual.style.setProperty("--motion-rotate", "0deg");
      };

      link.addEventListener("pointermove", event => {
        if (event.pointerType === "touch") return;
        const rect = link.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) - .5;
        const y = ((event.clientY - rect.top) / rect.height) - .5;
        visual.style.setProperty("--motion-x", `${(x * 7).toFixed(2)}px`);
        visual.style.setProperty("--motion-y", `${(y * 5).toFixed(2)}px`);
        visual.style.setProperty("--motion-rotate", `${(x * 2.4).toFixed(2)}deg`);
      });
      link.addEventListener("pointerleave", resetMotion);
      link.addEventListener("pointercancel", resetMotion);
    });

    openSessions.addEventListener("click", () => {
      navigateTo("sesiones");
    });

    backHome.addEventListener("click", () => {
      navigateTo("inicio");
    });

    document.querySelectorAll(".session-back").forEach(button => {
      button.addEventListener("click", () => navigateTo("sesiones"));
    });

    function navigateTo(hash){
      const nextHash = `#${hash}`;
      if (location.hash === nextHash) {
        routeFromHash();
      } else {
        location.hash = hash;
      }
    }

    calendarLink.addEventListener("click", async event => {
      event.preventDefault();
      try{
        const response = await fetch(calendarLink.href, { method:"HEAD", cache:"no-store" });
        if (!response.ok) throw new Error("Calendario no disponible");
        location.href = calendarLink.href;
      }catch(e){
        alert("El calendario de eventos de este mes estará disponible muy pronto.");
      }
    });

    function timeToSeconds(str){
      const parts = str.split(":").map(part => part.trim());
      if (parts.length === 2) {
        const m = parseInt(parts[0], 10) || 0;
        const s = parseInt(parts[1], 10) || 0;
        return (m * 60) + s;
      }
      if (parts.length === 3) {
        const h = parseInt(parts[0], 10) || 0;
        const m = parseInt(parts[1], 10) || 0;
        const s = parseInt(parts[2], 10) || 0;
        return (h * 3600) + (m * 60) + s;
      }
      return 0;
    }

    function clamp(n, min, max){
      return Math.max(min, Math.min(max, n));
    }

    function formatTime(sec){
      if (!Number.isFinite(sec) || sec < 0) return "0:00";
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);

      if (h > 0) {
        return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      }
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    function applyFallbackSource(mediaEl, fallbackUrl, resumeTime = 0, shouldResume = false, isVideo = false){
      if (!fallbackUrl) return;

      try{
        mediaEl.pause();
      }catch(e){}

      mediaEl.src = fallbackUrl;
      mediaEl.load();

      mediaEl.addEventListener("loadedmetadata", () => {
        if (!isVideo && Number.isFinite(resumeTime) && resumeTime > 0) {
          try{
            mediaEl.currentTime = resumeTime;
          }catch(e){}
        }

        if (isVideo) {
          mediaEl.loop = true;
          mediaEl.playbackRate = VIDEO_RATE;
        }

        if (shouldResume) {
          mediaEl.play().catch(() => {});
        }
      }, { once:true });
    }

    function setupSingleMediaHls(mediaEl, hlsUrl, fallbackUrl, isVideo){
      const nativeType = "application/vnd.apple.mpegurl";

      if (isVideo) {
        mediaEl.muted = true;
        mediaEl.defaultMuted = true;
        mediaEl.setAttribute("muted", "");
        mediaEl.setAttribute("playsinline", "");
        mediaEl.setAttribute("webkit-playsinline", "");
      }

      if (!hlsUrl) {
        if (fallbackUrl) {
          mediaEl.src = fallbackUrl;
          mediaEl.load();
        }
        return null;
      }

      if (mediaEl.canPlayType(nativeType)) {
        mediaEl.addEventListener("error", () => {
          const resumeTime = isVideo ? 0 : (mediaEl.currentTime || 0);
          const shouldResume = isVideo ? true : !mediaEl.paused;
          applyFallbackSource(mediaEl, fallbackUrl, resumeTime, shouldResume, isVideo);
        }, { once:true });

        mediaEl.src = hlsUrl;
        mediaEl.load();
        return null;
      }

      if (window.Hls && Hls.isSupported()) {
        const instance = new Hls({
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          lowLatencyMode: false
        });

        instance.loadSource(hlsUrl);
        instance.attachMedia(mediaEl);

        instance.on(Hls.Events.ERROR, (_, data) => {
          if (!data || !data.fatal) return;

          const resumeTime = isVideo ? 0 : (mediaEl.currentTime || 0);
          const shouldResume = isVideo ? true : !mediaEl.paused;

          try{
            instance.destroy();
          }catch(e){}

          applyFallbackSource(mediaEl, fallbackUrl, resumeTime, shouldResume, isVideo);
        });

        return instance;
      }

      applyFallbackSource(mediaEl, fallbackUrl, 0, isVideo, isVideo);
      return null;
    }

    function closeOtherDrawers(currentId){
      for (const session of sessions) {
        if (session.id !== currentId) {
          session.app.classList.remove("open");
        }
      }
    }

    function pauseOtherAudios(currentId){
      for (const session of sessions) {
        if (session.id !== currentId) {
          session.pauseAll();
        }
      }
    }

    function createSession(def){
      const audioDefs = Array.isArray(def.audioSegments) && def.audioSegments.length
        ? def.audioSegments
        : [{
            audioId: def.audId,
            hlsUrl: def.audioHlsUrl,
            fallbackUrl: def.audioFallbackUrl,
            startAt: 0
          }];

      const session = {
        id: def.id,
        title: def.title,
        app: document.getElementById(def.appId),
        section: document.getElementById(def.sectionId),
        vid: document.getElementById(def.vidId),
        aud: null,
        audioSegments: [],
        activeAudioSegment: null,
        btn: document.getElementById(def.btnId),
        iconPlay: document.getElementById(def.iconPlayId),
        iconPause: document.getElementById(def.iconPauseId),
        shareBtn: document.getElementById(def.shareBtnId),
        currentTimeEl: document.getElementById(def.currentTimeId),
        openLibrary: document.getElementById(def.openLibraryId),
        closeLibrary: document.getElementById(def.closeLibraryId),
        overlay: document.getElementById(def.overlayId),
        tracksEl: document.getElementById(def.tracksId),
        coverSrc: def.coverSrc,
        storageKey: def.storageKey,
        videoHlsUrl: def.videoHlsUrl,
        videoFallbackUrl: def.videoFallbackUrl,
        trackNameEls: [],
        videoStarted: false,
        hlsVideo: null,
        hlsAudio: [],
        tracks: def.tracks.map(track => ({
          t: track.t,
          at: track.at,
          sec: timeToSeconds(track.at),
          unlocked: def.tracksStartUnlocked !== false
        }))
      };

      session.audioSegments = audioDefs
        .map((segmentDef, index) => ({
          index,
          el: document.getElementById(segmentDef.audioId),
          hlsUrl: segmentDef.hlsUrl || "",
          fallbackUrl: segmentDef.fallbackUrl || "",
          startAt: typeof segmentDef.startAt === "number"
            ? segmentDef.startAt
            : timeToSeconds(segmentDef.startAt || "0:00"),
          hls: null
        }))
        .sort((a, b) => a.startAt - b.startAt);

      session.activeAudioSegment = session.audioSegments[0];
      session.aud = session.activeAudioSegment.el;

      session.setActiveAudioSegment = segment => {
        if (!segment) return;
        session.activeAudioSegment = segment;
        session.aud = segment.el;
      };

      session.getActiveAudio = () => {
        return session.activeAudioSegment ? session.activeAudioSegment.el : null;
      };

      session.getCurrentTime = () => {
        const activeAudio = session.getActiveAudio();
        if (!activeAudio || !session.activeAudioSegment) return 0;
        return session.activeAudioSegment.startAt + (activeAudio.currentTime || 0);
      };

      session.findSegmentForTime = seconds => {
        let chosen = session.audioSegments[0];
        for (const segment of session.audioSegments) {
          if (seconds >= segment.startAt) {
            chosen = segment;
          } else {
            break;
          }
        }
        return chosen;
      };

      session.showPlay = () => {
        session.iconPlay.style.display = "block";
        session.iconPause.style.display = "none";
        session.btn.setAttribute("aria-label", "Reproducir");
      };

      session.showPause = () => {
        session.iconPlay.style.display = "none";
        session.iconPause.style.display = "block";
        session.btn.setAttribute("aria-label", "Pausar");
      };

      session.updateTime = (time = session.getCurrentTime()) => {
        session.currentTimeEl.textContent = formatTime(time);
      };

      session.saveUnlockedTracks = () => {
        try{
          const unlockedIndexes = [];
          for (let i = 0; i < session.tracks.length; i++) {
            if (session.tracks[i].unlocked) unlockedIndexes.push(i);
          }
          localStorage.setItem(session.storageKey, JSON.stringify(unlockedIndexes));
        }catch(e){}
      };

      session.loadUnlockedTracks = () => {
        try{
          const raw = localStorage.getItem(session.storageKey);
          if (!raw) return;
          const unlockedIndexes = JSON.parse(raw);
          if (!Array.isArray(unlockedIndexes)) return;

          for (const idx of unlockedIndexes) {
            if (Number.isInteger(idx) && idx >= 0 && idx < session.tracks.length) {
              session.tracks[idx].unlocked = true;
            }
          }
        }catch(e){}
      };

      session.unlockTrack = index => {
        const track = session.tracks[index];
        if (!track || track.unlocked) return false;

        track.unlocked = true;
        const nameEl = session.trackNameEls[index];
        if (nameEl) nameEl.textContent = track.t;
        session.saveUnlockedTracks();
        return true;
      };

      session.closeDrawer = () => {
        session.app.classList.remove("open");
      };

      session.openDrawer = () => {
        closeOtherDrawers(session.id);
        session.app.classList.add("open");
      };

      session.ensureVideoRunning = async () => {
        session.vid.playbackRate = VIDEO_RATE;
        if (session.vid.paused) {
          await session.vid.play();
        }
        session.videoStarted = true;
      };

      session.playAll = async () => {
        pauseOtherAudios(session.id);

        const activeAudio = session.getActiveAudio();
        if (!activeAudio) return;

        try{
          await Promise.all([
            activeAudio.play(),
            session.ensureVideoRunning()
          ]);
          session.showPause();
        }catch(e){
          if (activeAudio.paused) session.showPlay();
        }
      };

      session.pauseAll = () => {
        for (const segment of session.audioSegments) {
          segment.el.pause();
        }
        session.showPlay();
      };

      session.resetAllAudios = () => {
        for (const segment of session.audioSegments) {
          try{
            segment.el.pause();
          }catch(e){}
          try{
            segment.el.currentTime = 0;
          }catch(e){}
        }
        session.setActiveAudioSegment(session.audioSegments[0]);
      };

      session.setRelativeTime = (segment, relativeTime, autoplay = true) => {
        if (!segment) return;

        session.setActiveAudioSegment(segment);

        for (const other of session.audioSegments) {
          if (other !== segment) {
            other.el.pause();
          }
        }

        const audioEl = segment.el;
        const applyTime = () => {
          const max = Number.isFinite(audioEl.duration) ? audioEl.duration : relativeTime;
          const target = clamp(relativeTime, 0, max);
          try{
            audioEl.currentTime = target;
          }catch(e){}

          session.updateTime(segment.startAt + target);

          if (autoplay) {
            session.playAll();
          } else if (audioEl.paused) {
            session.showPlay();
          }
        };

        if (audioEl.readyState >= 1) {
          applyTime();
        } else {
          audioEl.addEventListener("loadedmetadata", applyTime, { once:true });
        }
      };

      session.seekTo = (seconds, autoplay = true) => {
        const segment = session.findSegmentForTime(seconds);
        const relativeTime = Math.max(0, seconds - segment.startAt);
        session.setRelativeTime(segment, relativeTime, autoplay);
        session.updateTime(seconds);
      };

      session.renderTracks = () => {
        session.tracksEl.innerHTML = "";
        session.trackNameEls.length = 0;

        for (let i = 0; i < session.tracks.length; i++) {
          const track = session.tracks[i];
          const displayName = track.unlocked ? track.t : "¿?";
          const trackBtn = document.createElement("button");
          trackBtn.className = "track";
          trackBtn.type = "button";
          trackBtn.innerHTML = `
            <span class="cover"><img src="${session.coverSrc}" alt=""></span>
            <span class="meta">
              <span class="name">${displayName}</span>
              <span class="time">${track.at}</span>
            </span>
          `;

          const nameEl = trackBtn.querySelector(".name");
          session.trackNameEls.push(nameEl);

          trackBtn.addEventListener("click", () => {
            session.unlockTrack(i);
            session.seekTo(track.sec, true);
            session.closeDrawer();
          });

          session.tracksEl.appendChild(trackBtn);
        }
      };

      session.hlsVideo = setupSingleMediaHls(session.vid, session.videoHlsUrl, session.videoFallbackUrl, true);
      session.hlsAudio = session.audioSegments.map(segment => {
        segment.hls = setupSingleMediaHls(segment.el, segment.hlsUrl, segment.fallbackUrl, false);
        return segment.hls;
      });

      session.loadUnlockedTracks();
      session.renderTracks();
      session.updateTime(0);
      session.showPlay();

      session.btn.addEventListener("click", () => {
        const activeAudio = session.getActiveAudio();
        if (!activeAudio || activeAudio.paused) session.playAll();
        else session.pauseAll();
      });

      session.openLibrary.addEventListener("click", session.openDrawer);
      session.closeLibrary.addEventListener("click", session.closeDrawer);
      session.overlay.addEventListener("click", session.closeDrawer);

      for (let i = 0; i < session.audioSegments.length; i++) {
        const segment = session.audioSegments[i];
        const audioEl = segment.el;

        audioEl.addEventListener("loadedmetadata", () => {
          if (session.activeAudioSegment === segment) session.updateTime();
        });

        audioEl.addEventListener("durationchange", () => {
          if (session.activeAudioSegment === segment) session.updateTime();
        });

        audioEl.addEventListener("timeupdate", () => {
          if (session.activeAudioSegment === segment) session.updateTime();
        });

        audioEl.addEventListener("seeking", () => {
          if (session.activeAudioSegment === segment) session.updateTime();

              session.showPause();

              session.showPlay();

    function stopSession(session){
      session.pauseAll();
      session.closeDrawer();
      session.videoStarted = false;
      try{
        session.vid.pause();
      }catch(e){}
      session.section.hidden = true;
    }

    function showPortal(showSessions){
      for (const session of sessions) stopSession(session);
      portalShell.hidden = false;
      portalHome.hidden = showSessions;
      portalSessions.hidden = !showSessions;
    }

    function showSession(sessionId){
      const selected = sessions.find(session => session.id === sessionId);
      if (!selected) {
        showPortal(false);
        return;
      }

      portalShell.hidden = true;
      for (const session of sessions) {
        if (session === selected) {
          session.section.hidden = false;
        } else {
          stopSession(session);
        }
      }
      selected.ensureVideoRunning().catch(() => {});
    }

    function routeFromHash(){
      const route = location.hash.slice(1);
      if (sessions.some(session => session.id === route)) {
        showSession(route);
      } else {
        showPortal(route === "sesiones");
      }
      window.scrollTo(0, 0);
    }

    window.addEventListener("hashchange", routeFromHash);
    routeFromHash();

    window.addEventListener("load", () => {
      routeFromHash();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        const active = sessions.find(session => !session.section.hidden);
        if (active) active.ensureVideoRunning().catch(() => {});
      }
    });
